<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analysis checks</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 24px; background: #0b1220; color: #e2e8f0; }
  .pass { color: #4ade80; }
  .fail { color: #fb7185; }
  iframe { width: 1200px; height: 800px; border: 1px solid #334155; margin-top: 16px; }
</style>
</head>
<body>
<h1>Analysis button and transition checks</h1>
<div id="out"></div>
<script type="module">
/**
 * Exercise analysis buttons and saved results in an app frame. The E. coli
 * fixture adds two test genes without changing the network's stoichiometry.
 */
import { sha256 } from '../src/core/reproducibility.js';

const out = document.getElementById('out');
const lines = [];
let failures = 0;
let total = 0;

function check(name, passed) {
  total += 1;
  if (!passed) {
    failures += 1;
  }
  const line = document.createElement('div');
  line.className = passed ? 'pass' : 'fail';
  line.textContent = `${passed ? 'OK' : 'FAIL'} ${name}`;
  out.appendChild(line);
  lines.push(line.textContent);
}

async function tick() {
  await new Promise(resolve => requestAnimationFrame(resolve));
  await new Promise(resolve => setTimeout(resolve, 30));
}

async function waitFor(read, label) {
  const deadline = Date.now() + 30000;
  while (!read()) {
    if (Date.now() > deadline) {
      throw new Error(`Timed out: ${label}`);
    }
    await tick();
  }
}

try {
  const frame = document.createElement('iframe');
  frame.src = new URLSearchParams(location.search).has('standalone') ? '../coxeter_mfv.html' : '../index.html';
  document.body.appendChild(frame);
  await waitFor(() => frame.contentWindow?.escherMCMC?.store?.solution?.status === 'optimal', 'startup');
  const app = frame.contentWindow;
  const doc = app.document;
  const store = app.escherMCMC.store;

  async function upload(id, text, name) {
    const input = doc.getElementById(id);
    const transfer = new app.DataTransfer();
    transfer.items.add(new app.File([text], name));
    input.files = transfer.files;
    input.dispatchEvent(new app.Event('change', { bubbles: true }));
    await waitFor(() => input.value === '' && store.status.state !== 'busy', name);
    await tick();
  }

  async function workspace(name) {
    doc.querySelector('[data-action="left-tab"][data-tab="model"]').click();
    await tick();
    doc.querySelector(`#task-panel [data-workspace="${name}"]`).click();
    await tick();
  }

  function change(selector, value) {
    const input = doc.querySelector(selector);
    if (!input) {
      throw new Error(`Missing control: ${selector}`);
    }
    input.value = value;
    input.dispatchEvent(new app.Event('change', { bubbles: true }));
  }

  async function gimme() {
    await workspace('omics');
    const before = store.solution;
    doc.querySelector('[data-action="run-gimme"]').click();
    await waitFor(() => store.solution !== before && store.solution?.gimme, 'GIMME');
    await tick();
  }

  async function startOrdinary(method) {
    const close = doc.querySelector('[data-action="close-workspace"]');
    if (close && close.getClientRects().length) {
      close.click();
    }
    doc.querySelector('[data-action="left-tab"][data-tab="analysis"]').click();
    await tick();
    doc.querySelector(`#task-panel [data-action="run-${method}"]`).click();
  }

  async function ordinary(method) {
    await startOrdinary(method);
    await waitFor(() => store.lastRun?.method === method && store.lastRun.phase !== 'running', method);
    await tick();
  }

  const raw = await (await fetch('../models/ecoli_core_mc.json')).json();
  raw.reactions.find(reaction => reaction.id === 'GAPD').gene_reaction_rule = 'test_gap';
  raw.reactions.find(reaction => reaction.id === 'PGI').gene_reaction_rule = 'test_pgi';
  await upload('model-file-input', JSON.stringify(raw), 'eco.json');
  const species = store.species[0].id;
  const baseline = store.solution.objectiveValue;
  const drawing = JSON.stringify(store.map.toJSON());
  check('the annotated E. coli fixture imports and solves', store.solution.status === 'optimal');
  await workspace('omics');
  await upload('metatranscriptomics-file-input',
    `MAG,gene,condition,TPM\n${species},test_gap,Control,1\n${species},test_pgi,Control,8\n${species},test_gap,Treatment,8\n${species},test_pgi,Treatment,1\n`, 'test-expression.csv');
  check('the expression file maps both test genes', store.omics.report.measuredGenes === 2);
  change('[data-action="gimme-objective-fraction"]', '80');
  change('[data-action="gimme-threshold"]', '5');

  for (const [method, archived, label] of [
    ['fba', 'FBA', 'FBA'], ['pfba', 'pFBA', 'pFBA'], ['loopless', 'loopless FBA', 'Loopless FBA'],
    ['cyclefree', 'CycleFreeFlux', 'CycleFreeFlux'], ['fva', 'FBA', 'FVA'], ['pfva', 'pFVA', 'pFVA'],
  ]) {
    await gimme();
    check(`GIMME before ${label} replaces previous methods and reports`,
      store.omics.gimmeEnabled && !store.parsimonious && !store.loopless && !store.cycleFree
      && !store.fvaEnabled && store.lastRun === null);
    check(`the persistent results bar names GIMME before ${label}`,
      doc.getElementById('results-summary').textContent.startsWith('GIMME'));
    await ordinary(method);
    check(`${label} button replaces GIMME and finishes its own analysis`,
      store.solution.status === 'optimal' && !store.solution.gimme && !store.omics.gimmeEnabled
      && store.omics.gimmeResult === null && store.lastRun.phase === 'done');
    check(`${label} has matching visible and exported provenance`,
      doc.getElementById('results-summary').textContent.includes(`${label} completed`)
      && (await store.reproducibilityBundle()).analysis.method === archived);
  }
  check('all six analysis button combinations preserve drawing geometry', JSON.stringify(store.map.toJSON()) === drawing);

  for (const method of ['fva', 'pfva']) {
    const problem = store.problem;
    const variability = problem.variabilityAsync;
    let release;
    let held = false;
    let finished = false;
    let pause = true;
    const pending = new Promise(resolve => {
      release = resolve;
    });
    problem.variabilityAsync = async function(ids, options) {
      const ranges = await variability.call(this, ids.slice(0, 20), {
        ...options,
        onProgress: (partial, done) => {
          options.onProgress(partial, done, ids.length);
        },
      });
      if (pause) {
        held = true;
        await pending;
      }
      finished = true;
      return ranges;
    };
    try {
      await startOrdinary(method);
      await waitFor(() => held, `${method} partial ranges`);
      store.cancelFVA();
      await tick();
      check(`${method} cancellation immediately finishes the report and keeps partial ranges visible`,
        store.lastRun.phase === 'cancelled' && store.status.state === 'ok' && store.fvaRanges.size === 20
        && doc.getElementById('results-summary').textContent.includes('cancelled'));
      const cancelled = await store.reproducibilityBundle();
      const primary = method === 'pfva' ? 'pFBA' : 'FBA';
      check(`${method} cancellation exports its completed primary solution without incomplete ranges`,
        cancelled.analysis.method === primary && !cancelled.analysis.fvaEnabled && cancelled.solution.fva === null);
      await workspace('scenario');
      check(`${method} partial ranges are labelled incomplete with the whole reaction count`,
        doc.querySelector('.sc-card').textContent.includes(`FVA incomplete: 20/${problem.rxnIds.length}`));
      release();
      await waitFor(() => finished, `${method} retired completion`);
      await tick();
      pause = false;
      await ordinary(method);
      check(`${method} incomplete completion fails its report instead of claiming success`,
        store.lastRun.phase === 'failed' && store.fvaRanges.size === 20);
      const incomplete = await store.reproducibilityBundle();
      check(`${method} incomplete completion still exports only its completed primary solution`,
        incomplete.analysis.method === primary && !incomplete.analysis.fvaEnabled && incomplete.solution.fva === null);
    } finally {
      release();
      problem.variabilityAsync = variability;
    }
  }

  await ordinary('pfba');
  await gimme();
  doc.querySelector('[data-action="disable-gimme"]').click();
  await tick();
  check('Return FBA runs ordinary FBA after a pFBA to GIMME sequence',
    !store.parsimonious && !store.loopless && !store.cycleFree && !store.fvaEnabled && !store.omics.gimmeEnabled
    && Math.abs(store.solution.objectiveValue - baseline) < 1e-7);

  await gimme();
  await workspace('medium');
  const beforeMedium = store.solution;
  change('[data-action="medium-number"][data-base="glc__D"]', '5');
  await waitFor(() => store.medium.glc__D === 5 && store.solution !== beforeMedium, 'GIMME medium edit');
  check('editing the medium recomputes GIMME with its selected objective target',
    store.solution.gimme && store.omics.gimmeEnabled
    && Math.abs(store.solution.objectiveValue - 0.8 * store.problem.optimize().objectiveValue) < 1e-7);

  await workspace('omics');
  const beforeTyping = store.solution;
  const target = doc.querySelector('[data-action="gimme-objective-fraction"]');
  target.value = '60';
  target.dispatchEvent(new app.Event('input', { bubbles: true }));
  await tick();
  check('typing a GIMME target leaves the active calculation unchanged until commit',
    store.solution === beforeTyping && store.omics.gimmeObjectiveFraction === 0.8);
  target.dispatchEvent(new app.Event('change', { bubbles: true }));
  await tick();
  check('committing a GIMME target recomputes the result with matching provenance',
    store.solution !== beforeTyping && store.solution.objectiveFraction === 0.6
    && (await store.reproducibilityBundle()).analysis.gimme.objectiveFraction === 0.6);

  const beforeZero = store.solution;
  change('[data-action="gimme-threshold"]', '0');
  await tick();
  check('a zero expression threshold is committed and recomputed',
    store.solution !== beforeZero && store.solution.threshold === 0 && store.omics.gimmeThreshold === 0);
  const beforeAuto = store.solution;
  change('[data-action="gimme-threshold"]', '');
  await tick();
  check('a blank threshold restores automatic threshold calculation',
    store.solution !== beforeAuto && store.omics.gimmeThreshold === null && store.solution.threshold > 0);
  const beforeCondition = store.solution;
  change('[data-action="community-omics-condition-a"]', 'Treatment');
  await tick();
  check('changing expression condition recomputes the selected GIMME analysis',
    store.solution !== beforeCondition && store.solution.gimme
    && (await store.reproducibilityBundle()).analysis.gimme.condition === 'Treatment');

  const beforeDisplay = store.solution;
  doc.querySelector('[data-action="omics-compare"]').click();
  await tick();
  change('[data-action="community-omics-condition-b"]', 'Control');
  await tick();
  change('[data-action="community-omics-metric"]', 'difference');
  await tick();
  change('[data-action="community-omics-pseudocount"]', '2');
  await tick();
  doc.querySelector('[data-action="omics-toggle"]').click();
  await tick();
  check('comparison, pseudocount and visibility controls leave the numerical solve unchanged',
    store.solution === beforeDisplay && store.omics.mode === 'compare' && !store.omics.enabled);

  const replacement = `MAG,gene,condition,TPM\n${species},test_gap,New,4\n${species},test_pgi,New,9\n`;
  const beforeReplace = store.solution;
  await upload('metatranscriptomics-file-input', replacement, 'replacement-expression.csv');
  check('replacing active expression data recomputes GIMME for the new condition',
    store.solution !== beforeReplace && store.solution.gimme && store.omics.conditionA === 'New');
  const beforeUnmapped = { solution: store.solution, omics: store.omics, drawing: store.map };
  await upload('metatranscriptomics-file-input',
    'MAG,gene,condition,TPM\nunknown,unmapped,Missing,4\n', 'unmapped-expression.csv');
  check('an unmapped replacement is rejected visibly and preserves the active data and result',
    store.status.state === 'error' && doc.getElementById('results-summary').classList.contains('is-error')
    && store.omics === beforeUnmapped.omics && store.solution === beforeUnmapped.solution
    && store.map === beforeUnmapped.drawing);
  for (const [name, text, missing] of [
    ['missing-species.csv', 'gene,condition,TPM\ntest_gap,New,4\n', 'species/MAG/organism'],
    ['missing-gene.csv', `MAG,condition,TPM\n${species},New,4\n`, 'gene/gene_id/locus_tag'],
  ]) {
    await upload('metatranscriptomics-file-input', text, name);
    check(`${name} explains the missing column in English without changing the active data`,
      store.status.state === 'error' && store.status.message.includes(`The table needs a ${missing} column.`)
      && store.omics === beforeUnmapped.omics && store.solution === beforeUnmapped.solution);
  }
  await upload('metatranscriptomics-file-input', replacement, 'recovered-expression.csv');
  check('a valid expression replacement recovers after an unmapped rejection',
    store.status.state === 'ok' && store.solution.gimme && store.omics.dataset.source === 'recovered-expression.csv');

  const archive = await store.reproducibilityBundle();
  await ordinary('fba');
  const unusable = structuredClone(archive);
  unusable.omics.values = { unknown: { id: 'unmapped', species, values: { New: 4 } } };
  delete unusable.integrity;
  unusable.integrity = { algorithm: 'SHA-256', payloadHash: await sha256(unusable) };
  const beforeBundle = { state: store.stateJSON(), map: store.map, solution: store.solution };
  await upload('reproducibility-file-input', JSON.stringify(unusable), 'unmapped-gimme-bundle.json');
  check('a GIMME bundle with unmapped expression is rejected before replacing the open work',
    store.status.state === 'error' && doc.getElementById('results-summary').classList.contains('is-error')
    && store.stateJSON() === beforeBundle.state && store.map === beforeBundle.map && store.solution === beforeBundle.solution);
  await upload('reproducibility-file-input', JSON.stringify(archive), 'gimme-bundle.json');
  check('a GIMME bundle restores and numerically replays the selected analysis',
    store.reproducibilityReplay?.replay.pass && store.solution.gimme && store.omics.gimmeEnabled
    && store.omics.gimmeThreshold === null);
  doc.querySelector('[data-action="clear-solution"]').click();
  await tick();
  check('Clear solution removes GIMME and holds automatic solving', store.solution === null && store.solutionCleared);
  await workspace('omics');
  change('[data-action="gimme-objective-fraction"]', '70');
  await upload('metatranscriptomics-file-input',
    `MAG,gene,condition,TPM\n${species},test_gap,Held,40\n${species},test_pgi,Held,90\n`, 'held-expression.csv');
  check('parameter and expression edits respect Clear solution until Run GIMME',
    store.solution === null && store.solutionCleared && store.omics.gimmeObjectiveFraction === 0.7);
  await gimme();
  check('Run GIMME resumes a cleared solution', store.solution?.gimme && !store.solutionCleared);
  check('automatic thresholds stay automatic after bundle import and adapt to new expression values',
    store.omics.gimmeThreshold === null && store.solution.threshold > archive.analysis.gimme.threshold);

  await workspace('scenario');
  change('[data-action="scenario"]', 'sc:solo-ecoli');
  await waitFor(() => store.scenario?.id === 'solo-ecoli' && store.status.state !== 'busy', 'new scenario');
  await tick();
  check('opening a scenario retires GIMME and its previous result',
    store.solution?.status === 'optimal' && !store.solution.gimme && !store.omics.gimmeEnabled
    && store.omics.gimmeResult === null);

  for (const [coefficient, sense] of [[1, 'min'], [-1, 'max']]) {
    for (const id of Object.keys(store.objectiveCoefficients())) {
      store.setObjectiveCoefficient(id, 0);
    }
    store.setObjectiveCoefficient('eco@ATPM', coefficient);
    store.setObjectiveSense(sense);
    store.setPFBABiomassPercent(90);
    const problem = store.problem;
    const variability = problem.variabilityAsync;
    problem.variabilityAsync = function(ids, options) {
      return variability.call(this, ids.slice(0, 20), options);
    };
    try {
      await ordinary('pfva');
    } finally {
      problem.variabilityAsync = variability;
    }
    const objective = store.solution.objectiveValue;
    check(`${sense} signed-objective pFVA retains its primary interval solution after incomplete ranges`,
      store.lastRun.phase === 'failed' && Math.abs(objective - coefficient * 8.39) < 1e-6);
    const bundle = await store.reproducibilityBundle();
    check(`${sense} primary-only archive records the interval without claiming completed variability`,
      bundle.analysis.method === 'pFBA' && bundle.analysis.pfbaExactObjective === false
      && !bundle.analysis.fvaEnabled && bundle.solution.fva === null);
    await upload('reproducibility-file-input', JSON.stringify(bundle), `${sense}-primary-interval.json`);
    check(`${sense} primary-only archive reopens through the file control without changing its objective`,
      Math.abs(store.solution.objectiveValue - objective) < 1e-6 && !store.fvaEnabled);
    const report = await store.methodsProvenanceReport();
    check(`${sense} Methods text preserves the primary objective interval`,
      report.bundle.analysis.pfbaExactObjective === false
      && report.text.includes('pFBA minimized total absolute flux within')
      && !report.text.includes('pFBA fixed the primary objective'));
  }
} catch (error) {
  check(error.message, false);
}

document.title = failures ? `FAIL (${failures})` : 'PASS';
window.__checkComplete = Promise.resolve({ failures, total, lines });
</script>
</body>
</html>
