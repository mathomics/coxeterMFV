<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay lifecycle checks</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 24px; background: #0b1220; color: #e2e8f0; }
  .pass { color: #4ade80; }
  .fail { color: #fb7185; }
  iframe { width: 1200px; height: 800px; border: 1px solid #334155; margin-top: 16px; }
</style>
</head>
<body>
<h1>Reproducibility verdicts after further work</h1>
<div id="out"></div>
<script type="module">
/** Exercise imported replay reports through actual controls without desktop input. */
const out = document.getElementById('out');
const lines = [];
let failures = 0;
let total = 0;

function check(name, passed) {
  total += 1;
  if (!passed) {
    failures += 1;
  }
  const line = document.createElement('div');
  line.className = passed ? 'pass' : 'fail';
  line.textContent = `${passed ? 'OK' : 'FAIL'} ${name}`;
  out.appendChild(line);
  lines.push(line.textContent);
}

async function tick() {
  await new Promise(resolve => requestAnimationFrame(resolve));
  await new Promise(resolve => setTimeout(resolve, 30));
}

async function waitFor(read, label) {
  const deadline = Date.now() + 30000;
  while (!read()) {
    if (Date.now() > deadline) {
      throw new Error(`Timed out: ${label}`);
    }
    await tick();
  }
}

try {
  const frame = document.createElement('iframe');
  frame.src = new URLSearchParams(location.search).has('standalone') ? '../coxeter_mfv.html' : '../index.html';
  document.body.appendChild(frame);
  await waitFor(() => frame.contentWindow?.escherMCMC?.store?.solution?.status === 'optimal', 'startup');
  const app = frame.contentWindow;
  const doc = app.document;
  const store = app.escherMCMC.store;

  async function upload(id, text, name) {
    const input = doc.getElementById(id);
    const transfer = new app.DataTransfer();
    transfer.items.add(new app.File([text], name));
    input.files = transfer.files;
    input.dispatchEvent(new app.Event('change', { bubbles: true }));
    await waitFor(() => input.value === '' && store.status.state !== 'busy', name);
    await tick();
  }

  async function workspace(name) {
    doc.querySelector('[data-action="close-workspace"]')?.click();
    doc.querySelector('[data-action="left-tab"][data-tab="model"]').click();
    await tick();
    doc.querySelector(`#task-panel [data-workspace="${name}"]`).click();
    await tick();
  }

  function change(selector, value) {
    const input = doc.querySelector(selector);
    if (!input) {
      throw new Error(`Missing control: ${selector}`);
    }
    input.value = value;
    input.dispatchEvent(new app.Event('change', { bubbles: true }));
  }

  async function report() {
    doc.querySelector('[data-action="results-tab"][data-tab="analysis"]').click();
    await tick();
    doc.querySelector('[data-analysis-tab="repro"]').click();
    await tick();
    return doc.querySelector('[data-analysis-content="repro"]').textContent;
  }

  async function replay(bundle) {
    await upload('reproducibility-file-input', JSON.stringify(bundle), 'replay-lifecycle.json');
    if (!store.reproducibilityReplay?.replay?.pass) {
      throw new Error('The fixture did not replay successfully.');
    }
    await report();
  }

  function retired() {
    return !store.reproducibilityReplay
      && doc.querySelector('[data-analysis-tab="repro"]').disabled
      && !doc.querySelector('.repro-verdict');
  }

  const raw = await (await fetch('../models/ecoli_core_mc.json')).json();
  raw.reactions.find(reaction => reaction.id === 'GAPD').gene_reaction_rule = 'test_gap';
  await upload('model-file-input', JSON.stringify(raw), 'replay-fixture.json');
  const bundle = await store.reproducibilityBundle();
  await replay(bundle);
  check('a fresh replay exposes its successful numerical verdict', (await report()).includes('Reproducibility verified'));

  doc.querySelector('[data-action="toggle-theme"]').click();
  await tick();
  check('a display choice preserves the imported numerical verdict', Boolean(store.reproducibilityReplay?.replay?.pass));
  await upload('file-input', '{broken', 'rejected-scenario.json');
  check('a rejected file preserves the imported numerical verdict', Boolean(store.reproducibilityReplay?.replay?.pass));

  await workspace('medium');
  const objective = store.solution.objectiveValue;
  change('[data-action="medium-number"][data-base="glc__D"]', '5');
  await waitFor(() => store.medium.glc__D === 5 && store.status.state !== 'busy', 'medium edit');
  check('a medium edit disables the old verdict and changes the numerical result', retired() && store.solution.objectiveValue < objective);

  await replay(bundle);
  doc.querySelector('[data-action="clear-solution"]').click();
  await waitFor(() => store.solution === null, 'Clear solution');
  check('Clear solution removes the old verification from its report and tab', retired());

  await replay(bundle);
  await workspace('scenario');
  change('[data-action="pfba-biomass-percent"]', '75');
  await waitFor(() => store.pfbaBiomassPercent === 75, 'fraction edit');
  check('an unused but changed analysis setting retires the old input verdict', retired());

  await replay(bundle);
  const menu = doc.querySelector('.analysis-menu');
  menu.open = true;
  menu.querySelector('[data-action="run-pfba"]').click();
  await waitFor(() => store.lastRun?.method === 'pfba' && store.lastRun.phase !== 'running', 'pFBA');
  check('a new analysis has its own result without the imported verification', retired() && store.solution.status === 'optimal');

  await replay(bundle);
  await workspace('scenario');
  change('[data-action="scenario"]', 'sc:solo-ecoli');
  await waitFor(() => store.scenario?.id === 'solo-ecoli' && store.status.state !== 'busy', 'scenario choice');
  check('changing the model retires its previous replay report', retired());

  await replay(bundle);
  const species = store.species[0].id;
  const expression = `MAG,gene,condition,TPM\n${species},test_gap,Control,1\n${species},test_gap,Treatment,10\n`;
  await upload('metatranscriptomics-file-input', expression, 'expression.csv');
  check('replacing expression data retires the imported input verdict', retired());
  await workspace('omics');
  doc.querySelector('[data-action="run-gimme"]').click();
  await waitFor(() => store.solution?.gimme, 'GIMME');
  const gimme = await store.reproducibilityBundle();
  await replay(gimme);
  await workspace('omics');
  const reportBeforeDisplay = store.reproducibilityReplay;
  doc.querySelector('[data-action="omics-toggle"]').click();
  await tick();
  check('omics display changes keep the GIMME replay verdict', store.reproducibilityReplay === reportBeforeDisplay);
  change('[data-action="gimme-threshold"]', '0');
  await waitFor(() => store.omics.gimmeThreshold === 0, 'GIMME input');
  check('a changed GIMME parameter replaces the result and retires its verdict', retired() && store.solution.gimme);

  await replay(gimme);
  await workspace('omics');
  doc.querySelector('[data-action="run-gimme"]').click();
  await waitFor(() => !store.reproducibilityReplay, 'GIMME rerun');
  check('running GIMME again retires its earlier imported verdict', retired());
  await replay(bundle);
  check('a later valid bundle import installs a fresh verification', (await report()).includes('Reproducibility verified'));
} catch (error) {
  check(error.message, false);
}

document.title = failures ? `FAIL (${failures})` : 'PASS';
window.__checkComplete = Promise.resolve({ failures, total, lines });
</script>
</body>
</html>
