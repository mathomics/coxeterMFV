<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export checks</title>
<style>
  body { font: 13px/1.6 ui-monospace, monospace; margin: 24px; background: #0b1220; color: #e2e8f0; }
  .pass { color: #4ade80; }
  .fail { color: #fb7185; }
  iframe { width: 1200px; height: 800px; border: 1px solid #334155; margin-top: 16px; }
</style>
</head>
<body>
<h1>Export button and provenance checks</h1>
<p>Files are captured in memory. No system save dialog or disk download is opened.</p>
<div id="out"></div>
<script type="module">
/**
 * Exercise File menu exports through an in-memory save picker. This checks
 * exported contents and error handling without testing the operating system dialog.
 */
import { verifyReproducibilityBundle } from '../src/core/reproducibility.js';

const out = document.getElementById('out');
const lines = [];
let failures = 0;
let total = 0;

function check(name, passed) {
  total += 1;
  if (!passed) {
    failures += 1;
  }
  const line = document.createElement('div');
  line.className = passed ? 'pass' : 'fail';
  line.textContent = `${passed ? 'OK' : 'FAIL'} ${name}`;
  out.appendChild(line);
  lines.push(line.textContent);
}

async function tick() {
  await new Promise(resolve => requestAnimationFrame(resolve));
  await new Promise(resolve => setTimeout(resolve, 30));
}

async function waitFor(read, label) {
  const deadline = Date.now() + 30000;
  while (!read()) {
    if (Date.now() > deadline) {
      throw new Error(`Timed out: ${label}`);
    }
    await tick();
  }
}

try {
  const frame = document.createElement('iframe');
  frame.src = new URLSearchParams(location.search).has('standalone') ? '../coxeter_mfv.html' : '../index.html';
  document.body.appendChild(frame);
  await waitFor(() => frame.contentWindow?.escherMCMC?.store?.solution?.status === 'optimal', 'startup');
  const app = frame.contentWindow;
  const doc = app.document;
  const store = app.escherMCMC.store;
  const saved = [];
  let saveMode = 'save';
  let pickerRequests = 0;
  let aborted = false;

  app.showSaveFilePicker = async (options) => {
    pickerRequests += 1;
    if (saveMode === 'cancel') {
      throw new app.DOMException('Cancelled by the export check.', 'AbortError');
    }
    let blob = null;
    return {
      name: options.suggestedName,
      async createWritable() {
        return {
          async write(content) {
            if (saveMode === 'fail') {
              throw new Error('Test write failure');
            }
            blob = content;
          },
          async close() {
            saved.push({ name: options.suggestedName, options, blob });
          },
          async abort() {
            aborted = true;
          },
        };
      },
    };
  };

  async function upload(id, text, name) {
    const input = doc.getElementById(id);
    const transfer = new app.DataTransfer();
    transfer.items.add(new app.File([text], name));
    input.files = transfer.files;
    input.dispatchEvent(new app.Event('change', { bubbles: true }));
    await waitFor(() => input.value === '' && store.status.state !== 'busy', name);
    await tick();
  }

  function clickExport(action) {
    const menu = doc.querySelector('.file-menu');
    menu.open = true;
    menu.querySelector(`[data-action="${action}"]`).click();
  }

  async function exportFile(action, extension, type) {
    const before = saved.length;
    clickExport(action);
    await waitFor(() => saved.length > before, action);
    await tick();
    const file = saved.at(-1);
    check(`${action} saves one ${extension} file with its declared MIME type`,
      saved.length === before + 1 && file.name.endsWith(`.${extension}`)
      && file.blob.type === type && file.blob.size > 0
      && file.options.types[0].accept[type][0] === `.${extension}`);
    return file.blob;
  }

  async function svgMetadata() {
    const blob = await exportFile('export-svg', 'svg', 'image/svg+xml');
    const svg = new app.DOMParser().parseFromString(await blob.text(), 'image/svg+xml');
    check('the SVG parses and includes map geometry without editor handles',
      !svg.querySelector('parsererror') && svg.querySelector('[data-rxn]') !== null
      && svg.querySelector('[data-geometry-handle], [data-canvas-resize], [data-reaction-handle]') === null);
    return JSON.parse(svg.querySelector('metadata').textContent);
  }

  const raw = await (await fetch('../models/ecoli_core_mc.json')).json();
  raw.reactions.find(reaction => reaction.id === 'GAPD').gene_reaction_rule = 'test_gap';
  await upload('model-file-input', JSON.stringify(raw), 'export-fixture.json');
  const species = store.species[0].id;
  check('the export fixture imports and solves', store.solution.status === 'optimal');

  const map = JSON.parse(await (await exportFile('map-save', 'json', 'application/json')).text());
  check('Map JSON includes the displayed drawing', JSON.stringify(map.map) === JSON.stringify(store.map.toJSON()));
  const model = JSON.parse(await (await exportFile('export-model-json', 'json', 'application/json')).text());
  check('Model JSON retains the source reactions and test gene rule',
    model.reactions.length === raw.reactions.length
    && model.reactions.find(reaction => reaction.id === 'GAPD').gene_reaction_rule === 'test_gap');
  const sbmlBlob = await exportFile('export-model-sbml', 'xml', 'application/sbml+xml');
  const sbml = new app.DOMParser().parseFromString(await sbmlBlob.text(), 'application/xml');
  check('Model SBML parses and retains every source reaction',
    !sbml.querySelector('parsererror') && sbml.getElementsByTagName('reaction').length === raw.reactions.length);

  const metadata = await svgMetadata();
  check('the FBA SVG names the actual solved method, objective and backend',
    metadata.analysis.method === 'FBA' && metadata.analysis.solver === 'GLPK (WebAssembly)'
    && metadata.analysis.objectiveValue === store.solution.objectiveValue);
  const png = await exportFile('export-png', 'png', 'image/png');
  const signature = new Uint8Array(await png.slice(0, 8).arrayBuffer());
  const bitmap = await app.createImageBitmap(png);
  check('PNG rasterization creates a decodable image with the PNG signature',
    [...signature].join(',') === '137,80,78,71,13,10,26,10' && bitmap.width > 0 && bitmap.height > 0);
  bitmap.close();
  const csv = await (await exportFile('export-csv', 'csv', 'text/csv')).text();
  check('the flux CSV includes solved reaction rows and no nonfinite numbers',
    csv.includes(`${species}@ATPM`) && csv.split('\n').length > raw.reactions.length && !/NaN|Infinity/.test(csv));
  const scenario = JSON.parse(await (await exportFile('export-state', 'json', 'application/json')).text());
  check('the Scenario export retains the active species and medium',
    scenario.species[0].id === species && JSON.stringify(scenario.medium) === JSON.stringify(store.medium));
  const bundle = JSON.parse(await (await exportFile('export-reproducibility', 'json', 'application/json')).text());
  check('the exported bundle verifies and records the actual GLPK result',
    (await verifyReproducibilityBundle(bundle)).valid
    && bundle.analysis.solver === 'GLPK (WebAssembly)' && bundle.solution.solver === 'glpk');
  const report = await (await exportFile('export-methods-provenance', 'md', 'text/markdown')).text();
  check('the Methods export names the recorded solver and enabled model',
    report.includes('Solver: GLPK (WebAssembly).') && report.includes('; enabled;'));

  await upload('metatranscriptomics-file-input',
    `MAG,gene,condition,TPM\n${species},test_gap,Control,1\n`, 'export-expression.csv');
  store.runCommunityGIMME({ gimmeThreshold: 5, gimmeObjectiveFraction: 0.8 });
  await tick();
  const gimmeMetadata = await svgMetadata();
  check('the GIMME SVG identifies its contextual simplex result',
    gimmeMetadata.analysis.method === 'GIMME' && gimmeMetadata.analysis.solver === 'Local simplex.js');
  const gimmeReport = await (await exportFile('export-methods-provenance', 'md', 'text/markdown')).text();
  check('the GIMME Methods export distinguishes both solver stages',
    gimmeReport.includes('primary objective: GLPK (WebAssembly)')
    && gimmeReport.includes('penalty minimisation: Local simplex.js'));

  await store.runAnalysis('fba');
  for (const id of Object.keys(store.objectiveCoefficients())) {
    store.setObjectiveCoefficient(id, 0);
  }
  store.setObjectiveCoefficient(`${species}@ATPM`, 1);
  store.setObjectiveSense('min');
  await tick();
  const customReport = await (await exportFile('export-methods-provenance', 'md', 'text/markdown')).text();
  check('the custom-objective Methods export records minimization and its exact coefficient',
    customReport.includes(`Custom objective (min): 1 ${species}@ATPM.`)
    && !customReport.includes('Community objective: sum-biomass.'));
  const customMetadata = await svgMetadata();
  check('the custom-objective SVG records the minimized expression and matching flux',
    customMetadata.analysis.objectiveSense === 'min'
    && Object.keys(customMetadata.analysis.customObjective.coefficients).length === 1
    && customMetadata.analysis.customObjective.coefficients[`${species}@ATPM`] === 1
    && Math.abs(customMetadata.analysis.objectiveValue - store.solution.fluxes.get(`${species}@ATPM`)) < 1e-7);

  await store.setObjective('product', 'ac');
  await tick();
  const productMetadata = await svgMetadata();
  check('the product-objective SVG identifies the metabolite being maximized',
    productMetadata.analysis.objective === 'product' && productMetadata.analysis.productTarget === 'ac'
    && productMetadata.analysis.objectiveValue === store.solution.objectiveValue);

  const beforeCancel = saved.length;
  const requests = pickerRequests;
  const logs = store.log.length;
  saveMode = 'cancel';
  clickExport('export-state');
  await waitFor(() => pickerRequests > requests, 'cancelled save request');
  await tick();
  check('cancelling a save writes no file and adds no success log', saved.length === beforeCancel && store.log.length === logs);
  saveMode = 'fail';
  clickExport('export-csv');
  await waitFor(() => store.status.state === 'error' && store.status.message.includes('Test write failure'), 'write rejection');
  check('a failed write aborts its stream and reports the error visibly',
    aborted && saved.length === beforeCancel && doc.getElementById('results-summary').classList.contains('is-error'));
  saveMode = 'save';
  const recovery = await (await exportFile('export-csv', 'csv', 'text/csv')).text();
  check('the next export succeeds after cancellation and a failed write', recovery.includes(`${species}@ATPM`));

  doc.querySelector('[data-action="clear-solution"]').click();
  await tick();
  const clearedMetadata = await svgMetadata();
  check('a cleared-map SVG does not claim a numerical result',
    clearedMetadata.analysis.method === null && clearedMetadata.analysis.solver === null
    && clearedMetadata.analysis.status === null && clearedMetadata.analysis.objectiveValue === null);
  check('all export checks avoided native dialogs and disk downloads',
    doc.querySelector('.save-dialog') === null && pickerRequests > saved.length);
} catch (error) {
  check(error.message, false);
}

document.title = failures ? `FAIL (${failures})` : 'PASS';
window.__checkComplete = Promise.resolve({ failures, total, lines });
</script>
</body>
</html>
